
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Sparklex</title>
<link rel="stylesheet" href="styles.css">
<style>
.sidebar{
  background:#111827;
  padding:20px;
}

.menu-item{
  background:#1e293b;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

.chat-box{
  margin:20px;
  background:#1e293b;
  padding:20px;
  border-radius:10px;
}

input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
}
</style>
</head>
<body>

<div class="sidebar">
  <h1>Sparklex Dashboard</h1>

  <div class="menu-item">New Chat</div>
  <div class="menu-item">Chat History</div>
  <div class="menu-item">Case Summaries</div>
  <div class="menu-item">Study Tools</div>
  <div class="menu-item">Pricing</div>
  <div class="menu-item">Settings</div>
</div>

<div class="chat-box">
  <h2>Ask Sparklex</h2>

  <input type="text"
         placeholder="Ask a legal question...">

  <p>Free Prompts Remaining Today: 5</p>
</div>

</body>
</html>
