<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sparklex</title>

<style>
.container{
  max-width:400px;
  margin:80px auto;
  padding:20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 8px;
}

.login-btn {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  cursor: pointer;
}

.back{
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Welcome Back</h1>
  <p>Login to Sparklex</p>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn" class="login-btn">Login</button>
  <button id="signupBtn" class="login-btn">Sign Up</button>

  <div class="back">
    <a href="index.html">← Back Home</a>
  </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ========================
// SUPABASE CONFIG (PASTE YOUR KEYS HERE)
// ========================
const supabaseUrl = "PASTE_YOUR_SUPABASE_URL_HERE";
const supabaseKey = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

// ========================
// INPUTS
// ========================
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

// ========================
// LOGIN
// ========================
document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (!email || !password) {
    alert("Please enter email and password");
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  window.location.href = "dashboard.html";
});

// ========================
// SIGN UP
// ========================
document.getElementById("signupBtn").addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (!email || !password) {
    alert("Please enter email and password");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  alert("Check your email for confirmation");
});
</script>

</body>
</html>
